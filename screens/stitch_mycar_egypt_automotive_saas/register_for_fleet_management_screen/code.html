<!-- Company Name -->

<script>
        // Subtle entrance animations for input fields
        document.querySelectorAll('input').forEach((input, index) => {
            input.style.transitionDelay = `${index * 50}ms`;
        });

        // Basic password toggle visibility (Visual only for UI demo)
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.querySelector('input[type="password"]');
        if(toggleBtn && passInput) {
            toggleBtn.addEventListener('click', () => {
                const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passInput.setAttribute('type', type);
                toggleBtn.querySelector('span').innerText = type === 'password' ? 'visibility' : 'visibility_off';
            });
        }
    </script>
