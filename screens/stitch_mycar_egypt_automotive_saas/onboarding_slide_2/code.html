<body class="bg-background text-on-background min-h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-background/70 backdrop-blur-md flex justify-between items-center px-margin-mobile h-16 z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="directions_car">directions_car</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">AutoSaaS Premium</span>
</div>
<button class="text-primary font-title-md text-title-md hover:opacity-80 transition-opacity active:scale-95 transition-transform">
            Skip
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-16 pb-32">
<!-- Premium Visual Section -->
<div class="relative w-full max-w-lg aspect-square mb-lg group">
<!-- Animated Background Glow -->
<div class="absolute inset-0 bg-primary/5 rounded-full blur-3xl scale-90 group-hover:scale-100 transition-transform duration-1000"></div>
<!-- Main Illustration Image -->
<div class="relative w-full h-full rounded-xl overflow-hidden shadow-2xl border border-outline-variant/30 glass-card">
<div class="absolute inset-0 bg-gradient-to-tr from-surface-container-low to-transparent opacity-50"></div>
<div class="w-full h-full bg-cover bg-center" data-alt="A highly detailed close-up of a premium digital automotive dashboard interface displaying sophisticated financial analytics and expense charts. The visual features sleek, minimalist UI elements with thin lavender and deep blue lines on a clean light-mode background. Soft studio lighting highlights the glass-like textures and technical precision of the data overlays. The overall aesthetic is professional, corporate, and technologically advanced, mirroring the craftsmanship of a luxury vehicle diagnostic tool." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDdDLvdeYPs6jQVEHmf02y4lYs1t5LoywbIa3xm_LDlnj_7F2arEmh-506PDDOUM9B6RTvK8eKc7ThUdeb0cJCvYX9kpNbxLRwxxcEe_yCQalAuWi7qoO032Qe3AH4BRXg46onWcUZA_9IbakphHdNhOZpAHELt16hozoROut2mMm5KjnI5IrBUQ9a-Nfh87h5fJWkpFT0XSA0nCSgGBNM80Yaulxo1y_NW20f4ALyHu3VZ_GB7IYoV23UteT1o0X_gZsqNu6wEs98')">
</div>
<!-- Floating Data Chips (Micro-interactions) -->
<div class="absolute top-8 right-8 animate-bounce delay-100">
<div class="glass-card px-md py-sm rounded-xl border border-white/40 shadow-lg flex items-center gap-sm">
<span class="material-symbols-outlined text-secondary" data-icon="payments">payments</span>
<span class="font-label-caps text-label-caps text-on-surface">LE 4,500</span>
</div>
</div>
<div class="absolute bottom-12 left-8 animate-pulse">
<div class="glass-card px-md py-sm rounded-xl border border-white/40 shadow-lg flex items-center gap-sm">
<span class="material-symbols-outlined text-error" data-icon="trending_up">trending_up</span>
<span class="font-label-caps text-label-caps text-on-surface">Fuel Tracking</span>
</div>
</div>
</div>
</div>
<!-- Text Content -->
<div class="text-center max-w-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary mb-md tracking-tight">
                Track Every Penny
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed">
                Automate your expense tracking. Log fuel, repairs, and insurance costs with ease to optimize your fleet's efficiency.
            </p>
</div>
<!-- Onboarding Progress Indicators (Dots) -->
<div class="flex gap-sm mt-xl"><div class="w-2 h-2 rounded-full bg-outline-variant"></div><div class="w-6 h-2 rounded-full bg-primary transition-all duration-300"></div><div class="w-2 h-2 rounded-full bg-outline-variant"></div><div class="w-2 h-2 rounded-full bg-outline-variant"></div><div class="w-2 h-2 rounded-full bg-outline-variant"></div></div>
</main>
<!-- BottomNavBar (Transactional Navigation) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile py-lg bg-background/70 backdrop-blur-md">
<!-- Previous Button -->
<button class="flex flex-col items-center justify-center text-outline px-6 py-2 hover:bg-surface-container-high transition-colors active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined mb-xs" data-icon="arrow_back">arrow_back</span>
<span class="font-label-caps text-label-caps">Previous</span>
</button>
<!-- Next Button (Active State) -->
<button class="flex items-center gap-sm bg-primary text-on-primary rounded-full px-8 py-3 hover:opacity-90 active:scale-95 transition-all duration-200 shadow-lg"><span class="font-label-caps text-label-caps">Next</span><span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span></button>
</nav>
<script>
        // Micro-interaction for the "Next" button hover effect
        const nextBtn = document.querySelector('button.bg-primary-container');
        nextBtn.addEventListener('mouseenter', () => {
            const icon = nextBtn.querySelector('.material-symbols-outlined');
            icon.style.transform = 'translateX(4px)';
            icon.style.transition = 'transform 0.2s ease';
        });
        nextBtn.addEventListener('mouseleave', () => {
            const icon = nextBtn.querySelector('.material-symbols-outlined');
            icon.style.transform = 'translateX(0)';
        });
    </script>
