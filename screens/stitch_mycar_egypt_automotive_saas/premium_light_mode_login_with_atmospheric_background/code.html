<div class="fixed inset-0 pointer-events-none z-0" id="interactive-glow" style="background: radial-gradient(circle at 187px 854px, rgba(211, 228, 254, 0.15) 0%, transparent 40%);"></div>
<script>
        const glow = document.getElementById('interactive-glow');
        const bgImg = document.querySelector('.hero-image');
        
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            
            // Subtle radial lighting shift
            glow.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(211, 228, 254, 0.15) 0%, transparent 40%)`;
            
            // Subtle parallax for background
            const moveX = (x / window.innerWidth - 0.5) * 10;
            const moveY = (y / window.innerHeight - 0.5) * 10;
            bgImg.style.transform = `scale(1.02) translate(${moveX}px, ${moveY}px)`;
        });

        // Form focus visual feedback
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.relative').parentElement.classList.add('translate-x-1');
            });
            input.addEventListener('blur', () => {
                input.closest('.relative').parentElement.classList.remove('translate-x-1');
            });
        });
    </script>
