<style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .pagination-dot {
        transition: width 0.3s ease, background-color 0.3s ease;
      }
      .pagination-dot.active {
        width: 24px;
        background-color: #000000;
      }
    </style>

<body class="bg-background text-on-surface font-body-lg">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 bg-surface/70 backdrop-blur-xl flex justify-between items-center px-margin-mobile py-md">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="directions_car">directions_car</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary tracking-tight">AutoScale</span>
</div>
<button class="text-on-surface-variant font-label-caps uppercase tracking-wider hover:opacity-80 transition-opacity active:scale-95">
            Skip
        </button>
</header>
<main class="min-h-screen flex flex-col pt-[72px] pb-[100px]">
<!-- Visual Component: High-end Service Center Hero -->
<section class="relative px-margin-mobile flex-1 flex flex-col">
<div class="relative w-full aspect-[4/3] rounded-xl overflow-hidden shadow-sm mb-lg">
<div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent z-10"></div>
<img class="w-full h-full object-cover" data-alt="A premium, ultra-modern automotive service laboratory with clinical white floors and minimalist aesthetic. High-performance luxury vehicles are positioned on sleek, recessed diagnostic lifts. Professional automotive specialists in clean, tailored dark navy uniforms collaborate around a holographic engine diagnostic display. The lighting is crisp and cool, emphasizing a high-tech, futuristic corporate atmosphere consistent with a luxury SaaS brand." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB2a0K44WbB4JE7OxBi_IQtCGlPh7Z5LHSC8PYmCR9e95oCAn9ZvxSLsX4yfGwtgszc0hWLHEvamm8lN5a6YVVcekl-NanxfFKnprUrqFXvp5n9NvTB_ZHTYlPemiNn6eAw-yAi_Wwf8uP_JNKNXikawENikCPOf3H2w03KJpST4PmOWm2lRu2KaUdMplQQ7KI18ol_so0eg538W0xRUNlzMO3RiVJuvGNWBZoHIopQJyJdGPxx4b5bZsxCcBc8KvrT12KpqRA9QBQ">
<!-- Floating Glass Info Badge -->
<div class="absolute bottom-md left-md z-20 glass-card px-md py-sm rounded-lg flex items-center gap-sm border border-white/30">
<div class="flex -space-x-2">
<div class="w-8 h-8 rounded-full border-2 border-white bg-secondary-container flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-[16px]" data-icon="person">person</span>
</div>
<div class="w-8 h-8 rounded-full border-2 border-white bg-primary-container flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-white text-[16px]" data-icon="verified_user">verified_user</span>
</div>
</div>
<span class="text-label-caps text-on-surface font-semibold">1,200+ Verified Specialists</span>
</div>
</div>
<!-- Content Section -->
<div class="flex-1 flex flex-col justify-center max-w-lg mx-auto text-center md:text-left md:mx-0">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-md font-bold text-center">
                    Expert Care at Your Fingertips
                </h1>
<p class="font-body-lg text-on-surface-variant leading-relaxed text-center">
                    Connect with certified specialists and a community of owners. Access 24/7 support and verified reviews for every service provider.
                </p>
<!-- Value Chips (Small Grid) -->
<div class="grid grid-cols-2 gap-sm mt-lg">
<div class="flex items-center gap-sm p-sm bg-surface-container rounded-lg border border-outline-variant/30">
<span class="material-symbols-outlined text-primary" data-icon="support_agent">support_agent</span>
<span class="text-body-sm font-semibold">24/7 Support</span>
</div>
<div class="flex items-center gap-sm p-sm bg-surface-container rounded-lg border border-outline-variant/30">
<span class="material-symbols-outlined text-primary" data-icon="star">star</span>
<span class="text-body-sm font-semibold">Verified Reviews</span>
</div>
</div>
</div>
</section>
<!-- Pagination (Implicit centered above Bottom Bar) -->
<div class="flex justify-center items-center gap-2 mb-md"><div class="pagination-dot w-2 h-2 rounded-full bg-outline-variant"></div><div class="pagination-dot w-2 h-2 rounded-full bg-outline-variant"></div><div class="pagination-dot w-2 h-2 rounded-full bg-outline-variant"></div><div class="pagination-dot active h-2 rounded-full"></div><div class="pagination-dot w-2 h-2 rounded-full bg-outline-variant"></div></div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile py-lg pb-safe bg-surface border-t border-outline-variant shadow-sm rounded-t-xl">
<!-- Previous Button -->
<button class="flex flex-row items-center justify-center text-secondary px-lg py-sm font-label-caps uppercase tracking-wider hover:bg-secondary-container transition-colors active:scale-98">
<span class="material-symbols-outlined mr-sm text-[20px]" data-icon="chevron_left">chevron_left</span>
            Previous
        </button>
<!-- Primary Action: Get Started -->
<button class="flex flex-row items-center justify-center bg-primary text-on-primary rounded-full px-xl py-md font-label-caps uppercase tracking-wider hover:opacity-90 active:scale-98 transition-all duration-200 shadow-sm">
            Next
            <span class="material-symbols-outlined ml-xs" data-icon="chevron_right">chevron_right</span>
</button>
</nav>
<!-- Background Subtle Grain/Glow Effect -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-[10%] -right-[10%] w-[50%] h-[50%] bg-primary-fixed/20 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[10%] -left-[10%] w-[40%] h-[40%] bg-surface-container-high/40 rounded-full blur-[100px]"></div>
</div>
<script>
        // Simple Micro-interaction for the "Get Started" button
        const startBtn = document.querySelector('button.bg-primary');
        startBtn.addEventListener('mouseenter', () => {
            startBtn.querySelector('.material-symbols-outlined').style.transform = 'translateX(4px)';
        });
        startBtn.addEventListener('mouseleave', () => {
            startBtn.querySelector('.material-symbols-outlined').style.transform = 'translateX(0px)';
        });
    </script>




</body></html>
