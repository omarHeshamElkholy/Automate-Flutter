<body class="bg-background text-on-background min-h-screen flex flex-col overflow-hidden">

<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">AutoSaaS Premium</span>
</div>
<button class="font-label-caps text-label-caps text-outline hover:opacity-80 transition-opacity active:scale-95">
            Skip
        </button>
</header>
<main class="flex-1 flex flex-col pt-16 pb-24">
<!-- Hero Image Section (Asymmetric / Modern SaaS style) -->
<div class="relative w-full h-[50vh] md:h-[60vh] px-margin-mobile pt-sm">
<div class="w-full h-full rounded-full overflow-hidden shadow-2xl relative group">
<img class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="A high-end, close-up photograph of a modern luxury car dashboard featuring a glowing digital interface with real-time fleet analytics. The setting is a bright, minimalist automotive design studio with soft high-key lighting. The color palette consists of pristine whites, metallic silvers, and deep navy blue accents, reflecting a premium SaaS aesthetic. The atmosphere is sophisticated, clean, and technologically advanced, emphasizing precision engineering." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCyw8oJMPaJdE1cb-vg3c4qWHSf-RotecYveeWn7m9hYPsbzPgARZ9_emLXfhn4AMr9PZrQpYA_77YCZVYTexa-jhL4g61ctgaf8MaPx0AWb08yLpV8tfbiPqc3Yu4M_unEMz1LX4IqM2GwcPNaYSWjGCXogW4wCm6RkYXUL34RC6SjXdharIYwkDFX8O_H43EOYxtsnD_JjXtjVFZD0pyFWLzc9IQXQ7xK_HCyTFfHTFBWo7KdqkkVOdhf9NODZLEL7OLsdjisU1Q">
<!-- Floating Technical HUD Element -->
<div class="absolute top-8 right-8 glass-panel p-md rounded-xl border border-outline-variant/30 hidden md:block animate-pulse">
<div class="flex items-center gap-xs mb-xs">
<span class="w-2 h-2 rounded-full bg-success-600 bg-green-500"></span>
<span class="font-label-caps text-[10px] text-on-surface-variant">FLEET STATUS: OPTIMAL</span>
</div>
<div class="h-1 w-32 bg-outline-variant rounded-full overflow-hidden">
<div class="h-full bg-primary w-3/4"></div>
</div>
</div>
</div>
</div>
<!-- Content Section -->
<div class="flex-1 flex flex-col justify-center px-margin-mobile md:px-margin-desktop max-w-2xl mx-auto text-center md:text-left mt-lg">
<h1 class="font-display-lg text-[32px] md:text-display-lg text-primary tracking-tight mb-md leading-tight font-bold">
                Complete Fleet Control
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant opacity-80 leading-relaxed text-center">
                Monitor all your vehicles' health, location, and maintenance status in real-time from a single, intuitive dashboard.
            </p>
</div>
</main>
<!-- Bottom Navigation Section -->
<footer class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile py-lg bg-background/70 backdrop-blur-md">
<!-- Indicators (3 dots, 1st active) -->
<div class="flex gap-2 items-center"><div class="active-dot h-2 rounded-full bg-primary"></div><div class="w-2 h-2 rounded-full bg-outline-variant"></div><div class="w-2 h-2 rounded-full bg-outline-variant"></div><div class="w-2 h-2 rounded-full bg-outline-variant"></div><div class="w-2 h-2 rounded-full bg-outline-variant"></div></div>
<!-- Action Button (Next) -->
<button class="flex flex-row items-center justify-center bg-primary text-on-primary rounded-full px-xl py-md font-label-caps uppercase tracking-wider hover:opacity-90 active:scale-98 transition-all duration-200 shadow-sm group">
            Next
            <span class="material-symbols-outlined ml-xs transition-transform group-hover:translate-x-1" data-icon="chevron_right">chevron_right</span>
</button>
</footer>
<!-- Subtle Background Atmosphere -->
<div class="fixed inset-0 pointer-events-none -z-10 opacity-30">
<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary-container/10 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-secondary-container/20 rounded-full blur-[80px]"></div>
</div>
<script>
        // Simple Micro-interaction for the Next button
        const nextBtn = document.querySelector('button.group');
        nextBtn.addEventListener('mouseenter', () => {
            console.log('Interaction logged: User hovering Next button.');
        });
        
        // Parallax effect for the hero image on mouse move (Desktop only)
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
                const heroImg = document.querySelector('img');
                if(heroImg) {
                    heroImg.style.transform = `scale(1.05) translate(${moveX}px, ${moveY}px)`;
                }
            });
        }
    </script>
