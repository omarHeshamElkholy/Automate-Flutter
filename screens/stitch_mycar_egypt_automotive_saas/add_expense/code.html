<body class="bg-background text-on-background min-h-screen font-body-lg text-body-lg">
<!-- TopAppBar Shell -->
<header class="w-full sticky top-0 bg-surface/70 backdrop-blur-xl border-b border-outline-variant/30 flex items-center justify-between px-margin-mobile h-16 w-full z-50">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary text-[24px]">chevron_left</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">MyCar Egypt</h1>
</div>
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center overflow-hidden border border-outline-variant/30">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A professional studio headshot of a middle-aged male fleet manager with a confident expression. The lighting is soft and directional, typical of a high-end corporate portrait. The background is a clean, out-of-focus modern office environment with cool blue and grey tones, maintaining a premium and trustworthy aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD5POqtnGl60W6zNyGUG4Xzo5HxDt-v_gm4n9OIaTAvUl_zi8iiwXjsGxRs58W0ObOFWfiZLIE4p7nSI_Rsyifyy6gklQUrlCZECtYxbTK_d3ngikHFdus-iD_3zcIZLXitBpQR-lBG8ITyDYEAMgSzrWg5IYaL_SKPXtIWwzj6zx0B0_tuIo5f3rMvA30ajHp2cmvWpuCJZakdArlShdxGkYRATHeRHl0sihIsImmo1yFOZxsrm74nmuTAHFfZGYw7tN2ll0jL51Y">
</div>
</div>
</header>
<main class="px-margin-mobile pt-lg pb-xl max-w-2xl mx-auto">
<!-- Page Header -->
<div class="mb-xl">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary-container mb-xs">Add New Expense</h2>
<p class="text-secondary font-body-sm text-body-sm">Track your vehicle maintenance and running costs.</p>
</div>
<!-- Expense Form Container -->
<form class="flex flex-col gap-lg">
<!-- Amount Input (Hero Input) -->
<div class="glass-card border border-outline-variant/20 rounded-xl p-lg text-center shadow-sm">
<label class="font-label-caps text-label-caps text-secondary mb-base block">EXPENSE AMOUNT</label>
<div class="flex items-baseline justify-center gap-sm">
<span class="font-title-md text-title-md text-on-surface-variant">EGP</span>
<input class="bg-transparent border-none text-center font-display-lg text-display-lg text-primary w-full max-w-[200px] focus:ring-0 p-0" placeholder="0.00" step="0.01" type="number">
</div>
</div>
<!-- Category Grid -->
<section>
<h3 class="font-label-caps text-label-caps text-secondary mb-md">SELECT CATEGORY</h3>
<div class="grid grid-cols-3 sm:grid-cols-4 gap-sm">
<!-- Fuel -->
<button class="flex flex-col items-center justify-center gap-xs p-md rounded-xl border border-primary-container bg-primary-container text-on-primary-container transition-all active:scale-95" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">local_gas_station</span>
<span class="font-label-caps text-[10px]">Fuel</span>
</button>
<!-- Insurance -->
<button class="flex flex-col items-center justify-center gap-xs p-md rounded-xl border border-outline-variant/30 hover:bg-surface-container-high/50 transition-all active:scale-95" type="button">
<span class="material-symbols-outlined">verified_user</span>
<span class="font-label-caps text-[10px]">Insurance</span>
</button>
<!-- Maintenance -->
<button class="flex flex-col items-center justify-center gap-xs p-md rounded-xl border border-outline-variant/30 hover:bg-surface-container-high/50 transition-all active:scale-95" type="button">
<span class="material-symbols-outlined">build</span>
<span class="font-label-caps text-[10px]">Service</span>
</button>
<!-- Parking -->
<button class="flex flex-col items-center justify-center gap-xs p-md rounded-xl border border-outline-variant/30 hover:bg-surface-container-high/50 transition-all active:scale-95" type="button">
<span class="material-symbols-outlined">local_parking</span>
<span class="font-label-caps text-[10px]">Parking</span>
</button>
<!-- Car Wash -->
<button class="flex flex-col items-center justify-center gap-xs p-md rounded-xl border border-outline-variant/30 hover:bg-surface-container-high/50 transition-all active:scale-95" type="button">
<span class="material-symbols-outlined">local_car_wash</span>
<span class="font-label-caps text-[10px]">Wash</span>
</button>
<!-- Tolls -->
<button class="flex flex-col items-center justify-center gap-xs p-md rounded-xl border border-outline-variant/30 hover:bg-surface-container-high/50 transition-all active:scale-95" type="button">
<span class="material-symbols-outlined">payments</span>
<span class="font-label-caps text-[10px]">Tolls</span>
</button>
<!-- Registration -->
<button class="flex flex-col items-center justify-center gap-xs p-md rounded-xl border border-outline-variant/30 hover:bg-surface-container-high/50 transition-all active:scale-95" type="button">
<span class="material-symbols-outlined">assignment</span>
<span class="font-label-caps text-[10px]">License</span>
</button>
<!-- Other -->
<button class="flex flex-col items-center justify-center gap-xs p-md rounded-xl border border-outline-variant/30 hover:bg-surface-container-high/50 transition-all active:scale-95" type="button">
<span class="material-symbols-outlined">more_horiz</span>
<span class="font-label-caps text-[10px]">Other</span>
</button>
</div>
</section>
<!-- Details Section -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-secondary px-base">DATE</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">calendar_today</span>
<input class="w-full pl-xl pr-md py-md rounded-xl border border-outline-variant/30 bg-surface-container-lowest font-body-sm text-body-sm focus:border-primary-container transition-colors" type="date" value="2023-10-27">
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-secondary px-base">VEHICLE</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">directions_car</span>
<select class="w-full pl-xl pr-md py-md rounded-xl border border-outline-variant/30 bg-surface-container-lowest font-body-sm text-body-sm focus:border-primary-container appearance-none transition-colors">
<option>BMW X5 - [ABC 1234]</option>
<option>Mercedes S-Class - [XYZ 5678]</option>
</select>
</div>
</div>
</div>
<!-- Notes -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-secondary px-base">NOTES (OPTIONAL)</label>
<textarea class="w-full p-md rounded-xl border border-outline-variant/30 bg-surface-container-lowest font-body-sm text-body-sm focus:border-primary-container transition-colors resize-none" placeholder="Add extra details about this expense..." rows="3"></textarea>
</div>
<!-- Receipt Upload -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-secondary px-base">ATTACH RECEIPT</label>
<div class="border-2 border-dashed border-outline-variant/40 rounded-xl p-lg flex flex-col items-center justify-center gap-sm bg-surface-container/30 hover:bg-surface-container/50 transition-colors cursor-pointer group">
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center text-primary-container group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">add_a_photo</span>
</div>
<div class="text-center">
<p class="font-title-md text-title-md text-primary-container">Tap to upload</p>
<p class="font-body-sm text-body-sm text-secondary">PNG, JPG or PDF up to 5MB</p>
</div>
</div>
</div>
<!-- Action Button -->
<button class="mt-md w-full bg-primary-container text-on-primary-container py-lg rounded-xl font-title-md text-title-md shadow-lg shadow-primary-container/20 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
<span class="material-symbols-outlined">check_circle</span>
                Save Expense
            </button>
</form>
</main>
<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2 bg-surface/80 backdrop-blur-md border-t border-outline-variant/20 shadow-lg"><a class="flex flex-col items-center justify-center text-secondary hover:opacity-80 transition-opacity active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="home_repair_service">home_repair_service</span>
<span class="font-label-caps text-label-caps mt-1">Services</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:opacity-80 transition-opacity active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="garage">garage</span>
<span class="font-label-caps text-label-caps mt-1">Garage</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:opacity-80 transition-opacity active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label-caps text-label-caps mt-1">Records</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 transition-all active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="payments" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label-caps text-label-caps mt-1">Expenses</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:opacity-80 transition-opacity active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-caps text-label-caps mt-1">Profile</span>
</a></nav>
<!-- Extra spacing for bottom nav -->
<div class="h-24"></div>
<script>
        // Micro-interaction for Category Selection
        const categoryButtons = document.querySelectorAll('section button');
        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryButtons.forEach(b => {
                    b.classList.remove('bg-primary-container', 'text-on-primary-container');
                    b.classList.add('border-outline-variant/30');
                    b.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
                });
                btn.classList.add('bg-primary-container', 'text-on-primary-container');
                btn.classList.remove('border-outline-variant/30');
                btn.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
            });
        });

        // Simulate upload interaction
        const uploadZone = document.querySelector('.border-dashed');
        uploadZone.addEventListener('click', () => {
            const confirmed = confirm('Allow "MyCar Egypt" to access your camera and photo library?');
            if(confirmed) {
                uploadZone.innerHTML = `
                    <div class="flex items-center gap-md w-full">
                        <div class="w-16 h-16 bg-surface-container-highest rounded-lg overflow-hidden border border-outline-variant/30">
                            <img src="https://images.unsplash.com/photo-1554224155-1696413565d3?ixlib=rb-4.0.3&auto=format&fit=crop&w=150&q=80" class="w-full h-full object-cover" data-alt="A macro close-up photograph of a professional business receipt printed on thermal paper. The receipt features clear technical text and numerical data, resting on a polished dark wood desk surface. The lighting is bright and clean, casting sharp but soft shadows, emphasizing a neat and organized corporate workflow in a premium automotive service center environment.">
                        </div>
                        <div class="flex-1">
                            <p class="font-body-sm text-body-sm font-bold text-primary">receipt_271023.jpg</p>
                            <p class="font-label-caps text-[10px] text-secondary">Uploaded • 1.2 MB</p>
                        </div>
                        <span class="material-symbols-outlined text-error cursor-pointer">delete</span>
                    </div>
                `;
            }
        });
    </script>


</body></html>
